<!-- ByteLyfe: Perchance HTML panel.
     Paste this file into the HTML panel and main.pjs into the lists panel, then upload
     the src/src folder into the generator's file tree (see README.md).
     Keep this markup free of square and curly brackets outside script tags:
     Perchance evaluates them in the HTML panel. Perchance's page shell supplies the
     viewport meta tag. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@500..800&display=swap" rel="stylesheet">

<script>
  /* Theme boot: apply the saved theme before first paint. */
  (function () {
    try {
      var t = localStorage.getItem('bytelyfe:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

  </div>
</div>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
  /* Perchance plugin bridge. Files loaded from src/ do not get Perchance's bare plugin
     names, so copy the imports declared in main.pjs from root onto window. Keep this in
     step with main.pjs. Locally, local-dev/perchance-shim.js has already set root.kv. */
  (function () {
    var r = window.root;
    if (!r) return;
    try { if (typeof window.kv === 'undefined' && r.kv) window.kv = r.kv; } catch (e) {}
    try { if (typeof window.fullscreenButton === 'undefined' && r.fullscreenButton) window.fullscreenButton = r.fullscreenButton; } catch (e) {}
  })();
</script>
